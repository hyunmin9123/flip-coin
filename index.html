<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>동전 뒤집기 게임</title>
<style>
body{font-family:sans-serif;background:#1e2a3a;color:#fff;text-align:center;margin:0;padding:20px}
h1{margin:10px}
#board{display:flex;justify-content:center;gap:12px;margin:10px 0 20px;flex-wrap:wrap}
.card{background:#2c3e55;border-radius:10px;padding:10px 18px;min-width:90px}
.card small{display:block;opacity:.7;font-size:13px}
.card b{font-size:26px}
#msg{font-size:20px;min-height:32px;margin:12px;font-weight:bold}
#coins{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:700px;margin:15px auto;min-height:60px}
.coin{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid #fff3;font-size:18px;color:#222;background:#bbb}
.coin.H{background:#ffd54a}
.coin.T{background:#9aa5b1}
.coin.spin{background:#bbb;animation:spin .25s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.sp{font-size:16px;padding:6px 16px;margin:0 3px;background:#3b4d66}
.sp.on{background:#2196f3}
#btn{font-size:22px;padding:12px 36px;border:0;border-radius:10px;background:#4caf50;color:#fff;cursor:pointer}
button:disabled{background:#666}
button{border:0;border-radius:10px;color:#fff;cursor:pointer}
#btn{padding:12px 36px;background:#4caf50}
#btn:disabled{background:#666}
</style></head><body>
<h1>🪙 동전 뒤집기</h1>
<div id="board">
  <div class="card"><small>현재 동전</small><b id="n">1</b></div>
  <div class="card"><small>던진 횟수</small><b id="throws">0</b></div>
  <div class="card"><small>최대 동전 수</small><b id="best">1</b></div>
</div>
<div id="coins"></div>
<div id="msg">버튼을 눌러 동전을 던지세요!</div>
<div style="margin-bottom:14px">회전 속도:
<button class="sp on" data-s="1">1배속</button><button class="sp" data-s="2">2배속</button><button class="sp" data-s="4">4배속</button></div>
<button id="btn">던지기</button>
<p style="opacity:.7;font-size:14px;margin-top:30px">
모두 앞면 → 동전 2배 · 앞면 ≥ 뒷면 → 같은 개수 유지 · 뒷면이 더 많음 → 실패, 1개부터</p>
<script>
let n=1,best=1,throws=0,busy=false,speed=1;
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===b));});
const $=id=>document.getElementById(id);
function score(){$('n').textContent=n;$('throws').textContent=throws;$('best').textContent=best;}
function draw(state,res){
  $('coins').innerHTML='';
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    if(state==='spin'){d.className='coin spin';d.style.animationDuration=(0.25/speed)+'s';d.textContent='?';}
    else if(state==='result'){d.className='coin '+res[i];d.textContent=res[i]==='H'?'앞':'뒤';}
    else{d.className='coin';d.textContent='?';}
    $('coins').appendChild(d);
  }
}
$('btn').onclick=()=>{
  if(busy)return;busy=true;$('btn').disabled=true;
  throws++;score();$('btn').disabled=true;
  const res=Array.from({length:n},()=>Math.random()<0.5?'H':'T');
  const h=res.filter(x=>x==='H').length,t=n-h,cnt=n;
  $('msg').style.color='#fff';$('msg').textContent='던지는 중...';
  draw('spin');
  setTimeout(()=>{
    draw('result',res);
    let m,c,next=n;
    if(h===cnt){next=cnt*2;best=Math.max(best,next);m=`🎉 모두 앞면! 동전이 ${next}개로 늘어납니다`;c='#7CFC8A';}
    else if(h>=t){m=`😐 앞면 ${h} / 뒷면 ${t} — 유지! 같은 개수로 다시`;c='#ffd54a';}
    else{next=1;m=`💥 앞면 ${h} / 뒷면 ${t} — 실패! 1개부터 다시 시작`;c='#ff6b6b';}
    $('msg').textContent=m;$('msg').style.color=c;
    n=next;score();busy=false;$('btn').disabled=false;
  },1200/speed);
};
draw('idle');score();
</script></body></html>
